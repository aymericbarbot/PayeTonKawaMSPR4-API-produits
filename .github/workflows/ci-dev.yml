name: ci-dev-produits   # tests unitaires + intégration via docker-compose sur dev

on:
  push:
    branches: [dev]

permissions:
  contents: write

env:
  COMPOSE_FILE: docker-compose.yml   # adapte si ton fichier compose a un autre nom

jobs:
  # ────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TS
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  # ────────────────────────────────
  integration:
    needs: unit
    runs-on: ubuntu-latest
    name: tests intégration via Docker
    steps:
      - uses: actions/checkout@v4

      # ---------- .env depuis les secrets ----------
      - name: Create .env from GitHub secrets
        run: |
          cat > .env <<EOF
          PRODUIT_PORT=${{ secrets.PRODUIT_PORT }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          DB_FORWARD_PORT=${{ secrets.DB_FORWARD_PORT }}
          EOF

      # ---------- démarrage de la stack ----------
      - name: Build & up (-d)
        run: docker compose -f "$COMPOSE_FILE" up -d --build

      # ---------- exécution des tests d'intégration ----------
      - name: Run integration tests (ephemeral container)
        run: |
          docker compose run --rm \
            -e NODE_OPTIONS="--max_old_space_size=1536" \
            produit-service \
            npx jest --runInBand --ci test/integration

      # ---------- diagnostic en cas d'échec ----------
      - name: Inspect exit reason
        if: failure()
        run: |
          CID=$(docker compose ps -q produit-service | head -n 1)
          docker inspect $CID --format='OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}'
          echo '---- last 50 lines of container logs ----'
          docker logs --tail 50 $CID || true

      # ---------- arrêt et nettoyage ----------
      - name: Down & clean
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans

  # ────────────────────────────────
  handle-failure:
    needs: [unit, integration]
    if: failure()
    runs-on: ubuntu-latest
    env:
      ERR_BRANCH: error-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Git config bot
        run: |
          git config user.email "bot@github"
          git config user.name  "github-actions"

      - name: Branch error + rollback
        run: |
          git switch -c "$ERR_BRANCH"
          git push origin "$ERR_BRANCH"
          git switch ci-test
          git reset --hard HEAD~1
          git push --force-with-lease origin ci-test
